name: Source samples
# Fetches a sample from each outside source and keeps it on a side branch (samples-data). Started by hand only; the main
# branch and the site are not touched.
on:
  workflow_dispatch:
    inputs:
      names:
        description: "Which samples (the start of their names, separated by spaces); empty for all"
        required: false
        default: ""
      script:
        description: "The script to run"
        required: false
        default: "tools/samples.py"
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas
      - env:
          NAMES: ${{ inputs.names }}
          SCRIPT: ${{ inputs.script }}
        run: python "$SCRIPT" samples $NAMES
      - name: Keep the samples on a side branch
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          mv samples /tmp/samples
          git checkout -q --orphan samples-data
          git rm -rfq . || true
          mv /tmp/samples samples
          git add -f samples
          git commit -qm "Samples"
          git push -qf origin samples-data
