name: Senate after the election
# Once a week: once an election's results have settled (seven weeks after election day), its races are added to the
# Senate model's training data, the model is refitted for the next cycle and the back-test figures are made again
# (senate/after_election.py). Until then, and once an election is in, the run finds nothing to do.
on:
  schedule:
    - cron: "47 15 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: senate-after
  cancel-in-progress: false

jobs:
  after:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas

      - name: Add the last election, if it is due
        id: run
        continue-on-error: true
        run: python senate/after_election.py

      - name: Save
        if: steps.run.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          git add -A data/senate/          # the raw sources are kept out by .gitignore
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -m "Senate: the last election added to the training data, and the model refitted"
          for i in $(seq 1 40); do
            busy=0
            for s in in_progress queued; do
              n=$(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=$s&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
              busy=$((busy + n))
            done
            [ "$busy" = "0" ] && break
            sleep 15
          done
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep 10
          done
          echo "::warning::The repository kept changing while this run saved; next week's run tries again."

      - name: Flag a failed run
        if: steps.run.outcome == 'failure'
        run: echo "::warning::The after-election step failed this week; nothing was changed, and next week's run tries again."
