name: Senate money
# Once a day: what each Senate candidate's campaign has raised, from the FEC (senate/fec_live.py), for the Senate tab.
# Shown, not used in the forecast. The FEC key is the FEC_API_KEY secret; it is never written or printed. The hourly
# Senate forecast job starts this one when its last run is a day old, since GitHub's own schedule, below, starts runs
# late or not at all (RUNBOOK.md). Each run records the job's health in docs/api/health/senate-money.json.
on:
  schedule:
    - cron: "23 10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: senate-money
  cancel-in-progress: false

jobs:
  money:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas

      - name: Read the FEC's totals
        id: run
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: |
          set -o pipefail
          python senate/fec_live.py 2>&1 | tee "$RUNNER_TEMP/run.log"

      # The key is given to this step only so that it can be masked, should a run ever have printed it.
      - name: Record the job's health
        if: always()
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python senate/health.py senate-money "${{ steps.run.outcome }}" "$RUNNER_TEMP/run.log"

      - name: Save
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "forecast-bot"
          git config user.email "forecast-bot@users.noreply.github.com"
          msg="Senate money job: health $(TZ=America/New_York date '+%Y-%m-%d')"
          if [ "${{ steps.run.outcome }}" = "success" ]; then
            git add data/senate/20*/money.json data/senate/20*/fec_ids.json || true
            git diff --cached --quiet || msg="Senate money $(TZ=America/New_York date '+%Y-%m-%d')"
          fi
          git add docs/api/health/senate-money.json || true
          if git diff --cached --quiet; then echo "No new FEC totals, and the job's health is the same."; exit 0; fi
          git commit -q -m "$msg"
          git checkout -q -- .
          for i in $(seq 1 40); do
            busy=0
            for s in in_progress queued; do
              n=$(gh api "repos/${{ github.repository }}/actions/workflows/update.yml/runs?status=$s&per_page=1" --jq '.total_count' 2>/dev/null || echo 0)
              busy=$((busy + n))
            done
            [ "$busy" = "0" ] && break
            sleep 15
          done
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q && exit 0
            sleep 10
          done
          echo "::warning::The repository kept changing while this run saved; the next run tries again."

      - name: Flag a failed run
        if: steps.run.outcome == 'failure'
        run: echo "::warning::The FEC totals could not be read this time (docs/api/health/senate-money.json says why); the Senate tab keeps the last ones."
